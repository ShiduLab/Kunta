name: Forge Kunta APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build Kunta APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare Kunta.apk
        run: |
          APK=$(find android -type f -name "*debug*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK non trovato."
            find android -type f
            exit 1
          fi

          echo "APK trovato: $APK"
          cp "$APK" Kunta.apk

      - name: Upload Kunta APK
        uses: actions/upload-artifact@v4
        with:
          name: Kunta
          path: Kunta.apk
          if-no-files-found: error
