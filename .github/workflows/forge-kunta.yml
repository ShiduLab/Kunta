name: Forge Kunta

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Build Kunta.exe
        shell: cmd
        run: go build -trimpath -ldflags="-H windowsgui -s -w" -o Kunta.exe .\desktop

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kunta-Windows-x64
          path: Kunta.exe
          if-no-files-found: error

  pwa:
    name: PWA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript
        run: node --check pwa/app.js

      - name: Package PWA
        run: |
          cd pwa
          zip -r ../Kunta-PWA.zip .

      - name: Upload PWA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kunta-PWA
          path: Kunta-PWA.zip
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare Kunta.apk
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Kunta.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kunta-Android
          path: Kunta.apk
          if-no-files-found: error
